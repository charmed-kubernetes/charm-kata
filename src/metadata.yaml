name: kata
display-name: Kata
summary: Kata untrusted container runtime subordinate
maintainers:
  - Joe Borg <joseph.borg@canonical.com>
description: |
  Kata Containers is an open source community working to build a secure
  container runtime with lightweight virtual machines that feel and perform
  like containers, but provide stronger workload isolation using hardware
  virtualization technology as a second layer of defense.
docs: https://discourse.charmhub.io/t/kata-docs-index/6212
tags:
  - containers
series:
  - jammy
  - noble
subordinate: true
requires:
  containerd:
    interface: container-runtime
    scope: container
  untrusted:
    interface: untrusted-container-runtime
    scope: container
resources:
  kata-manager:
    type: file
    filename: kata-manager.sh
    description: |
      Script for installing kata sourced from
      https://raw.githubusercontent.com/kata-containers/kata-containers/main/utils/kata-manager.sh
  kata-archive:
    type: file
    filename: kata-static.tar.xz
    description: Offline release of kata
